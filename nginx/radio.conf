# ==============================================================================
# Nginx VirtualHost Configuration for Radio Platform (Ubuntu 24.04)
# Reverse Proxies Icecast stream + Serves PHP-FPM Web Application
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name radio.yourdomain.com stream.yourdomain.com;

    root /var/www/radio-platform/public;
    index index.php index.html;

    access_log /var/log/nginx/radio_access.log;
    error_log /var/log/nginx/radio_error.log;

    client_max_body_size 128M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Reverse Proxy for Icecast Audio Stream (/live and /live-dj)
    location ~ ^/(live|live-dj|stream|status-json.xsl) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cross-Origin headers for open streaming access
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Range, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        # Disable buffering for live streaming audio
        proxy_buffering off;
        proxy_ignore_client_abort off;
        tcp_nodelay on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Web Application Routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. Static Asset Caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 4. PHP-FPM FastCGI Handler (Ubuntu 24.04 PHP 8.3 / 8.2)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Support default Ubuntu 24.04 PHP 8.3 or 8.2 FPM socket
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
    }

    # 5. Deny Access to Sensitive Directories & Files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(config|storage|scripts|app|database|systemd|nginx) {
        deny all;
        return 404;
    }
}
